# Every PR and every push to the default branch (ADR 0006). The Coach is always the fake one
# here, so CI costs none of the owner's Claude limits; Coach changes are checked on the desktop.
name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # On a push, only the default branch; every other branch is checked through its PR.
    if: ${{ github.event_name != 'push' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (strict TypeScript and Svelte)
        run: npm run typecheck
      - name: Lint and glossary lint
        run: npm run lint
      - name: CODEOWNERS follows the protected-path list
        run: npm run check:paths
      - name: The built Lesson data matches its sources
        # The tests and the Engine check read data/lessons/, so a source change that wasn't rebuilt
        # would pass them unchecked.
        run: |
          node data-prep/lessons.ts
          if [ -n "$(git status --porcelain -- data/lessons/)" ]; then
            git status --short -- data/lessons/
            echo "::error::data/lessons/ is out of date with data/lesson-sources/: run node data-prep/lessons.ts and commit the result."
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Unit, golden, data and protocol tests (ADR checks included)
        run: npm test
      - name: The real-Coach check drives every Coach job (with the fake Coach)
        run: node scripts/real-coach-check.ts --fake
      - name: Lesson moves the PR adds pass the deep Engine check, with the tablebase in endgames
        # Depth 22 and the Lichess tablebase (data-prep/deep-check.ts), only on the moves this PR
        # adds or changes: a PR that changes no Lesson move spends a few seconds here.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          node data-prep/engine-check.ts --deep --changed-since="$BASE"

  journeys:
    name: Player journeys
    if: ${{ github.event_name != 'push' || github.ref_name == github.event.repository.default_branch }}
    # Not ubuntu-latest: it is Ubuntu 26.04 now, and Playwright 1.56 can't install Chromium there
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Back to ubuntu-latest once
    # @playwright/test is on a release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @chess-coach/web
      - name: Player journeys with the fake Coach
        run: npm run test:journeys
        env:
          CI: 'true'
      - name: Keep the report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # TEMPORARY: the README's Windows PowerShell step, run as written on a fresh policy. Removed
  # before the PR's final commit.
  readme-powershell:
    name: README PowerShell step (temporary)
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: npx is blocked, then runs after the README's command
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Continue'
          function Child([string]$cmd) {
            $out = & $env:PS_EXE -NoProfile -NonInteractive -Command "$cmd" 2>&1 | Out-String
            Write-Host "[$env:PS_EXE] $cmd`n$out"
            return $out
          }
          Write-Host "npx resolves to: $((Get-Command npx).Source)"
          # A fresh Windows desktop: Restricted, nothing set for the user.
          Set-ExecutionPolicy -Scope LocalMachine Restricted -Force
          Set-ExecutionPolicy -Scope CurrentUser Undefined -Force
          Child 'Get-ExecutionPolicy -List' | Out-Null
          $blocked = Child 'npx --version'
          if ($blocked -notmatch 'running scripts is disabled') { throw 'npx was not blocked as the README says' }
          $cmd = Child 'npx.cmd --version'
          if ($cmd -notmatch '^\s*\d+\.\d+') { throw 'npx.cmd did not run' }
          # The README's command (-Force only because CI can't answer its Y prompt).
          Child 'Set-ExecutionPolicy -Scope CurrentUser RemoteSigned -Force' | Out-Null
          $policy = Child 'Get-ExecutionPolicy'
          if ($policy.Trim() -ne 'RemoteSigned') { throw "Get-ExecutionPolicy printed $policy" }
          $ok = Child 'npx --version'
          if ($ok -notmatch '^\s*\d+\.\d+') { throw 'npx still did not run after the README step' }
          $npm = Child 'npm --version'
          if ($npm -notmatch '^\s*\d+\.\d+') { throw 'npm did not run after the README step' }
          # A script downloaded from the internet (Mark of the Web) is still blocked.
          $f = Join-Path $env:RUNNER_TEMP 'downloaded.ps1'
          Set-Content $f 'Write-Output ran'
          Set-Content -Path $f -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3"
          $dl = Child "& '$f'"
          if ($dl -match '(?m)^ran') { throw 'a downloaded unsigned script ran' }
          Write-Host 'README PowerShell step: all as written.'

