# The independent Verdict (ADR 0013). A fresh Claude Code session that did not write the PR reads
# the diff, drives a verify-mode copy of the app the way a Player would, and posts PASS, PASS+NOTES
# or FAIL as the "Verdict" status on the PR's head commit, which main requires.
#
# It runs once per finished PR, never on every push:
#   - a PR is marked ready for review (a draft never starts it);
#   - someone with write access comments "/verdict" on the PR, to judge the commit after a push;
#   - by hand from the Actions tab on main, with the PR number.
# A push leaves the new commit with a pending Verdict (pr-labels.yml), so a stale verdict never
# merges. PRs that change only the files in .github/no-verdict-paths.txt pass without a run.
#
# pull_request_target and issue_comment run this file as it is on main, so a PR can't change its own
# judge. They run with secrets, so forks are refused: only branches of this repository, which only
# people with write access can push, get their code run. Three jobs keep the PR's code away from
# any token that can write to GitHub:
#   gate   decides whether to judge, enforces the limits, waits for CI   (can post statuses)
#   judge  runs the PR's code, the real-Coach check and the judge         (read-only token)
#   post   reads what the judge wrote, as data, and posts it              (can post statuses)
# The PR's code still runs on the judge's machine, so it could forge the judge's files; that is why
# the owner still merges by hand (ADR 0006, ADR 0013).
name: Verdict

on:
  pull_request_target:
    types: [ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read

env:
  # Provider priority order (configurable via GitHub Repository Variables, no workflow edits needed).
  CI_PROVIDER_ORDER: ${{ vars.CI_PROVIDER_ORDER || 'codex,claude,opencode' }}
  JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER || '' }}
  COACH_CHECK_PROVIDER: ${{ vars.COACH_CHECK_PROVIDER || '' }}
  # Optional per-provider judge model overrides. The Claude real-Coach check always uses Haiku.
  JUDGE_MODEL: opus
  CLAUDE_JUDGE_MODEL: ${{ vars.CLAUDE_JUDGE_MODEL || 'opus' }}
  CODEX_JUDGE_MODEL: ${{ vars.CODEX_JUDGE_MODEL || '' }}
  OPENCODE_JUDGE_MODEL: ${{ vars.OPENCODE_JUDGE_MODEL || '' }}
  # Limits on judge runs (counted by their Verdict comments), per PR and per UTC day.
  MAX_RUNS_PER_PR: 3
  MAX_RUNS_PER_DAY: 10
  # The most one Claude judge run may spend, at API prices; Claude Code stops the run there.
  JUDGE_BUDGET_USD: 5
  CLAUDE_CODE_VERSION: 2.1.310
  PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  REPO: ${{ github.repository }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gate:
    name: Gate
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/verdict') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      IN: ${{ github.workspace }}/verdict-in
    outputs:
      judge: ${{ steps.ci.outputs.green }}
      sha: ${{ steps.pr.outputs.sha }}
      base: ${{ steps.pr.outputs.base }}
      coach: ${{ steps.pr.outputs.coach }}
    steps:
      - name: Check out main's scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find the PR and decide whether it needs a judge
        id: pr
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            # The comment's first word must be /verdict itself, not /verdicts or /verdict-please.
            line=${COMMENT%%$'\n'*}
            line=${line%$'\r'}
            word=${line%%[[:space:]]*}
            if [ "$word" != /verdict ]; then echo "The comment doesn't start with /verdict."; exit 0; fi
          fi
          mkdir -p "$IN"
          gh api "repos/$REPO/pulls/$PR" > "$IN/pull.json"
          sha=$(jq -r .head.sha "$IN/pull.json")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .base.ref "$IN/pull.json")" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .state "$IN/pull.json")" != open ]; then echo "PR #$PR is not open."; exit 0; fi
          if [ "$(jq -r .draft "$IN/pull.json")" = true ]; then echo "PR #$PR is a draft: mark it ready for review first."; exit 0; fi
          if [ "$(jq -r .head.repo.full_name "$IN/pull.json")" != "$REPO" ]; then
            node scripts/verdict.ts --status error --sha "$sha" --description "PRs from forks aren't judged here: the owner checks them by hand"
            exit 0
          fi
          status=$(gh api "repos/$REPO/commits/$sha/status" \
            --jq '([.statuses[] | select(.context == "Verdict")][0] // {}) | "\(.state // "")|\(.updated_at // "")|\(.description // "")"')
          current=${status%%|*}
          rest=${status#*|}
          updated=${rest%%|*}
          description=${rest#*|}
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ] && { [ "$current" = success ] || [ "$current" = failure ]; }; then
            echo "Commit $sha already has a verdict ($current); comment /verdict to judge it again."; exit 0
          fi
          # One run per commit at a time: a run that is judging posted "Judging…". A run takes at
          # most about 2.5 hours (the three jobs' time limits), so an older "Judging…" is stale.
          if [ "$current" = pending ] && [ "${description#Judging}" != "$description" ] \
            && [ $(( $(date -u +%s) - $(date -u -d "$updated" +%s) )) -lt 10800 ]; then
            echo "A run has been judging $sha since $updated: not starting another."; exit 0
          fi
          # GitHub runs no CI on a PR with merge conflicts, so waiting for it would wait the full 40 minutes.
          if [ "$(jq -r .mergeable "$IN/pull.json")" = false ]; then
            node scripts/verdict.ts --status error --sha "$sha" --description "This PR has merge conflicts, so CI can't run: resolve them, then comment /verdict"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' | sort -u > "$IN/changed.txt"
          node scripts/protected-paths.ts --needs-verdict < "$IN/changed.txt" > "$IN/judged.txt"
          if [ ! -s "$IN/judged.txt" ]; then
            node scripts/verdict.ts --status success --sha "$sha" --description "Changes only docs, tests or process files: no Verdict needed"
            exit 0
          fi
          runs_on_pr=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- verdict"))) | .id' | wc -l)
          today=$(date -u +%F)
          runs_today=$(gh api -X GET "repos/$REPO/issues/comments" -f since="${today}T00:00:00Z" -f per_page=100 --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"<!-- verdict\")) and (.created_at | startswith(\"$today\"))) | .id" | wc -l)
          echo "Verdict runs on this PR: $runs_on_pr of $MAX_RUNS_PER_PR; runs today: $runs_today of $MAX_RUNS_PER_DAY"
          if [ "$runs_on_pr" -ge "$MAX_RUNS_PER_PR" ] || [ "$runs_today" -ge "$MAX_RUNS_PER_DAY" ]; then
            node scripts/verdict.ts --status error --sha "$sha" --description \
              "Run limit reached ($runs_on_pr of $MAX_RUNS_PER_PR on this PR, $runs_today of $MAX_RUNS_PER_DAY today): the owner decides"
            exit 0
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"
          # The real-Coach check runs the PR's own copy of the script, so a PR that changes the script
          # leaves the real Coach status to the desktop.
          coach_status=$(gh api "repos/$REPO/commits/$sha/status" --jq '[.statuses[] | select(.context == "real Coach")][0].state // ""')
          if [ -n "$(node scripts/protected-paths.ts --match coach < "$IN/changed.txt")" ] \
            && ! grep -qx scripts/real-coach-check.ts "$IN/changed.txt" \
            && [ "$coach_status" != success ] && [ "$coach_status" != failure ]; then
            echo "coach=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark the commit as being judged
        if: steps.pr.outputs.go == 'yes'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          node scripts/verdict.ts --status pending --sha "$SHA" --description "Judging this commit: waiting for CI, then the judge drives the app"

      - name: Wait for CI to pass on this commit
        id: ci
        if: steps.pr.outputs.go == 'yes'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          for _ in $(seq 1 80); do
            state=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '
              # The CI run a branch push starts skips these jobs (ci.yml checks branches through their
              # PR), so its copies are left out.
              [.check_runs[] | select((.name == "Checks" or .name == "Player journeys") and .conclusion != "skipped")]
              | group_by(.name) | map(max_by(.id))
              | if length < 2 then "waiting"
                elif any(.status != "completed") then "waiting"
                elif all(.conclusion == "success") then "green"
                else "red" end')
            echo "CI: $state"
            if [ "$state" = green ]; then echo "green=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$state" = red ]; then
              node scripts/verdict.ts --status error --sha "$SHA" --description "CI isn't green on this commit: fix it, then comment /verdict"
              exit 0
            fi
            sleep 30
          done
          node scripts/verdict.ts --status error --sha "$SHA" --description "CI didn't finish within 40 minutes: comment /verdict to try again"

      - name: Tell the owner the judge is starting
        if: steps.ci.outputs.green == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            title=$(jq -r .title "$IN/pull.json")
            curl -fsS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=OpenChessCoach: the judge is starting on PR #$PR ($title). $RUN_URL" || echo "Telegram notice failed."
          fi

  judge:
    name: Judge
    needs: gate
    if: needs.gate.outputs.judge == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    concurrency:
      group: verdict-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      IN: ${{ github.workspace }}/verdict-in
      OUT: ${{ github.workspace }}/verdict-out
      SHA: ${{ needs.gate.outputs.sha }}
      BASE: ${{ needs.gate.outputs.base }}
    steps:
      - name: Check out main's judge instructions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Check out the PR's head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # No npm cache: this job runs in main's cache scope, and the PR's packages mustn't land there.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gather what the judge reads
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$IN" "$OUT/evidence"
          gh api "repos/$REPO/pulls/$PR" > "$IN/pull.json"
          # The gate may have waited up to 40 minutes for CI: judge only if the PR is still what it saw.
          if [ "$(jq -r .head.sha "$IN/pull.json")" != "$SHA" ]; then
            echo "The PR got a new commit before the judge started: comment /verdict to judge the new one" > "$OUT/skipped"
          elif [ "$(jq -r .state "$IN/pull.json")" != open ]; then
            echo "The PR was closed before the judge started" > "$OUT/skipped"
          elif [ "$(jq -r .draft "$IN/pull.json")" = true ]; then
            echo "The PR went back to draft before the judge started: mark it ready again" > "$OUT/skipped"
          fi
          if [ -s "$OUT/skipped" ]; then cat "$OUT/skipped"; exit 0; fi
          echo "fresh=yes" >> "$GITHUB_OUTPUT"
          git -C pr diff --name-only "origin/$BASE...$SHA" > "$IN/changed.txt"
          git -C pr diff "origin/$BASE...$SHA" > "$IN/diff.patch"
          jq --rawfile changed "$IN/changed.txt" \
            '{number, title, body, labels: [.labels[].name], base: .base.ref, head: .head.sha, changed: ($changed | split("\n") | map(select(length > 0)))}' \
            "$IN/pull.json" > "$IN/pr.json"
          : > "$IN/issues.md"
          for n in $(jq -r '.body // ""' "$IN/pull.json" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u); do
            gh issue view "$n" --json number,title,body --jq '"# Issue #\(.number): \(.title)\n\n\(.body)\n"' >> "$IN/issues.md" || true
          done

      - name: Install the app and the browser
        # Runs PR-controlled install/build scripts with NO provider secrets in the environment.
        if: steps.gather.outputs.fresh == 'yes'
        working-directory: pr
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build -w @chess-coach/web
          # A ready copy of the base branch, for the judge's before-and-after comparison.
          git worktree add --detach ../base "origin/$BASE"
          (cd ../base && npm ci && npx playwright install chromium && npm run build -w @chess-coach/web)

      - name: Install judge CLIs
        if: steps.gather.outputs.fresh == 'yes'
        env:
          HAS_CODEX_AUTH: ${{ secrets.OPENAI_API_KEY != '' || secrets.CODEX_API_KEY != '' || secrets.CODEX_AUTH_JSON != '' }}
          HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_CODEX_AUTH" = true ]; then
            npm install -g @openai/codex
            codex --version || true
          fi
          if [ "$HAS_CLAUDE_AUTH" = true ]; then
            npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
            claude --version || true
          fi
          npm install -g opencode-ai
          opencode --version || true

      - name: Real-Coach check, for a PR that touches the Coach
        # The same check the desktop runs (.claude/skills/real-coach-check/), walking CI_PROVIDER_ORDER.
        # Once more if it couldn't run (exit 2, such as a Think deeper timeout). The post job posts it.
        # Running out of time here mustn't stop the judge, so the step can fail without failing the job.
        # A failed check (exit 1) is a FAIL already, so the judge doesn't run.
        id: coach
        if: steps.gather.outputs.fresh == 'yes' && needs.gate.outputs.coach == 'yes'
        working-directory: pr
        timeout-minutes: 25
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENCODE_ZDR_FREE_MODELS: ${{ vars.OPENCODE_ZDR_FREE_MODELS }}
        run: |
          mkdir -p "$OUT/real-coach"
          for attempt in 1 2; do
            code=0
            node scripts/real-coach-check.ts --provider auto > "$OUT/real-coach/result.json" 2> "$OUT/real-coach/log.txt" || code=$?
            echo "Real-Coach check, attempt $attempt: exit $code"
            [ "$code" != 2 ] && break
          done
          echo "$code" > "$OUT/real-coach/exit"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -n 5 "$OUT/real-coach/log.txt"
          { jq '{ok, provider, description, calls: [.calls[] | select((.problems | length) > 0 or (.warnings | length) > 0)]}' "$OUT/real-coach/result.json" 2>/dev/null \
            || cat "$OUT/real-coach/log.txt"; } > "$IN/real-coach.txt"
          if [ "$code" = 1 ]; then
            jq -n --arg d "$(jq -r '.description // ""' "$OUT/real-coach/result.json")" \
              '{verdict: "FAIL", summary: ("The real-Coach check failed, so the judge didn'"'"'t run: " + $d)}' > "$OUT/verdict.json"
            { printf '### Problems\n\nThe real-Coach check failed on this commit, so the judge did not run. The calls with problems or warnings:\n\n```json\n'
              cat "$IN/real-coach.txt"; printf '\n```\n'; } > "$OUT/verdict.md"
          fi

      - name: The judge
        if: steps.gather.outputs.fresh == 'yes' && steps.coach.outputs.exit != '1'
        working-directory: pr
        timeout-minutes: 55
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENCODE_ZDR_FREE_MODELS: ${{ vars.OPENCODE_ZDR_FREE_MODELS }}
        run: |
          sed -e "s|{{PR}}|$PR|g" -e "s|{{SHA}}|$SHA|g" -e "s|{{BASE}}|$BASE|g" -e "s|{{IN}}|$IN|g" -e "s|{{OUT}}|$OUT|g" \
            -e "s|{{BASE_DIR}}|$GITHUB_WORKSPACE/base|g" ../trusted/.github/verdict-prompt.md > "$IN/verdict-prompt.md"
          # Marks a run that started the judge, so it counts toward the limits.
          touch "$OUT/started"
          node ../trusted/scripts/run-judge.ts \
            --prompt-file "$IN/verdict-prompt.md" \
            --out "$OUT" \
            --workdir "$PWD" \
            --max-budget-usd "$JUDGE_BUDGET_USD" \
            || echo "Judge runner exited with $?"
          if [ -f "$OUT/claude.json" ]; then
            jq '{subtype, num_turns, duration_ms, total_cost_usd, is_error}' "$OUT/claude.json" || true
          fi

      - name: Leave no secret in what gets published
        # Artifacts and comments on a public repository are public, and log masking doesn't reach them.
        id: scrub
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          mkdir -p "$OUT"
          cp -r pr/evidence "$OUT/app-evidence" 2>/dev/null || true
          rm -f "$HOME/.codex/auth.json"
          node trusted/scripts/run-judge.ts --scrub "$OUT"

      - name: Keep the judge's files
        if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verdict-evidence
          path: verdict-out/
          retention-days: 30
          if-no-files-found: ignore

  post:
    name: Post the Verdict
    needs: [gate, judge]
    if: ${{ always() && needs.gate.outputs.judge == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - name: Check out main's scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch what the judge wrote
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verdict-evidence
          path: verdict-out

      - name: Post the real-Coach status
        if: needs.gate.outputs.coach == 'yes'
        run: |
          code=$(cat verdict-out/real-coach/exit 2>/dev/null || echo none)
          if [ "$code" = 0 ] || [ "$code" = 1 ]; then
            description=$(jq -r '.description // "The real-Coach check gave no description"' verdict-out/real-coach/result.json)
            node scripts/verdict.ts --status "$([ "$code" = 0 ] && echo success || echo failure)" --context "real Coach" --sha "$SHA" --description "$description"
          else
            existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.statuses[] | select(.context == "real Coach")][0].state // ""' 2>/dev/null || true)
            if [ "$existing" = "success" ]; then
              echo "The real-Coach check couldn't run (exit $code), keeping existing passing status on $SHA."
            else
              reason=$(tail -n 1 verdict-out/real-coach/log.txt 2>/dev/null || true)
              [ -n "$reason" ] || reason="No real-Coach provider succeeded (exit $code). Check provider secrets or run the local independent fallback."
              node scripts/verdict.ts --status error --context "real Coach" --sha "$SHA" --description "$reason"
            fi
          fi

      - name: Post the Verdict
        run: node scripts/verdict.ts --post verdict-out --pr "$PR" --sha "$SHA" --run-url "$RUN_URL"
