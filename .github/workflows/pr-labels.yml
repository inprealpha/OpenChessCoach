# Labels a PR for the reviews it needs (ADR 0006), from lists read off the base branch so
# a PR can't exempt itself by editing them:
#   protected-path  touches a path in .github/protected-paths.txt: the owner reviews it before merging
#   touches-coach   touches a path in .github/coach-paths.txt: the "real Coach" status stays pending until the
#                   Verdict job (verdict.yml) or a desktop session runs scripts/real-coach-check.ts --post
#   no-evidence     the PR description's Evidence section is empty
# PRs that don't touch the Coach get a passing "real Coach" status, so it can be a required check.
# It also keeps the "Verdict" status (ADR 0013): a commit with no verdict yet gets a pending one, so a
# push always voids the last verdict; PRs that change only docs, tests or process files pass at once.
# The judge itself runs in verdict.yml.
# pull_request_target, so a PR from a fork gets its labels and status too: the job runs the base
# branch's workflow and code with a token that can write them, and never checks out the PR's code.
# Keep it that way: only the PR's file list and description, read through the API, come from the PR.
name: PR labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label for review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the path lists from the base branch
        run: |
          if git cat-file -e "origin/$BASE:scripts/protected-paths.ts" 2>/dev/null; then
            git checkout "origin/$BASE" -- scripts/protected-paths.ts .github/protected-paths.txt .github/coach-paths.txt
            git checkout "origin/$BASE" -- scripts/verdict.ts .github/no-verdict-paths.txt 2>/dev/null || true
          else
            echo "The base branch has no path lists yet; using the PR's own."
          fi
      - name: Find what the PR touches
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' | sort -u > changed.txt
          node scripts/protected-paths.ts --match protected < changed.txt > protected.txt
          node scripts/protected-paths.ts --match coach < changed.txt > coach.txt
          echo "Protected paths touched:"; cat protected.txt
          echo "Coach paths touched:"; cat coach.txt
      - name: Label
        run: |
          gh label create protected-path --repo "$REPO" --color B60205 --description "Touches a protected path: the owner reviews it before merging" 2>/dev/null || true
          gh label create touches-coach --repo "$REPO" --color 5319E7 --description "Touches the Coach: needs a passing real-Coach check from the desktop" 2>/dev/null || true
          gh label create no-evidence --repo "$REPO" --color FBCA04 --description "The PR description has no evidence from the running app" 2>/dev/null || true
          set_label() {
            if [ "$2" = yes ]; then gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" --silent
            else gh api -X DELETE "repos/$REPO/issues/$PR/labels/$1" --silent 2>/dev/null || true; fi
          }
          set_label protected-path "$([ -s protected.txt ] && echo yes || echo no)"
          set_label touches-coach "$([ -s coach.txt ] && echo yes || echo no)"
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > body.md
          # Evidence is whatever follows the "## Evidence" heading, up to the next heading, minus comments.
          evidence=$(awk '/^## /{inside=($0 ~ /^## Evidence/); next} inside' body.md | sed -e 's/<!--.*-->//g' | tr -d '[:space:]')
          set_label no-evidence "$([ -z "$evidence" ] && echo yes || echo no)"
      - name: Set the real Coach status
        run: |
          current=$(gh api "repos/$REPO/commits/$SHA/status" --jq '[.statuses[] | select(.context == "real Coach")][0].state // ""')
          if [ ! -s coach.txt ]; then
            gh api "repos/$REPO/statuses/$SHA" -f state=success -f context="real Coach" -f description="Does not touch the Coach"
          elif [ "$current" = success ] || [ "$current" = failure ]; then
            echo "The desktop already posted a verdict for $SHA: $current"
          else
            gh api "repos/$REPO/statuses/$SHA" -f state=pending -f context="real Coach" \
              -f description="Touches the Coach: the Verdict job runs the real-Coach check, or run it on the desktop"
          fi
      - name: Set the Verdict status
        if: ${{ hashFiles('scripts/verdict.ts') != '' }}
        env:
          GH_REPO: ${{ github.repository }}
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
        run: |
          node scripts/protected-paths.ts --needs-verdict < changed.txt > judged.txt
          current=$(gh api "repos/$REPO/commits/$SHA/status" --jq '([.statuses[] | select(.context == "Verdict")][0] // {}) | "\(.state // "")|\(.description // "")"')
          state=${current%%|*}
          description=${current#*|}
          if [ ! -s judged.txt ]; then
            node scripts/verdict.ts --status success --sha "$SHA" --description "Changes only docs, tests or process files: no Verdict needed"
          elif [ "$state" = success ] || [ "$state" = failure ] || [ "$state" = error ]; then
            echo "Commit $SHA already has a Verdict status: $state ($description)"
          elif [ "$ACTION" = ready_for_review ]; then
            echo "Marked ready for review: the Verdict workflow sets the status from here."
          elif [ "$state" = pending ] && [ "${description#Judging}" != "$description" ]; then
            echo "The judge is running on $SHA."
          elif [ "$DRAFT" = true ]; then
            node scripts/verdict.ts --status pending --sha "$SHA" --description "Draft: mark the PR ready for review to start the judge"
          else
            node scripts/verdict.ts --status pending --sha "$SHA" --description "No Verdict for this commit: comment /verdict to start the judge"
          fi
