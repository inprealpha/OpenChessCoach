# Releases the app to npm, so friends can run `npx openchesscoach@latest` (site/index.html).
#   - On a version tag (v0.2.0): checks the npm package on Windows, macOS and Linux, then publishes
#     it to npm and creates a GitHub release with the tarball. docs/releasing.md has the steps.
#   - Run by hand on the default branch (Actions → Release → Run workflow): the same, for the version
#     in packages/backend/package.json. The GitHub release creates its tag, so nobody pushes one.
#   - On a PR that touches how the package is built or started: the same package check, no publish.
# Publishing uses npm's trusted publishing (GitHub's OIDC token), so no npm token is stored here.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      # Everything bundled into the package's Node.js side, and how the web app is built.
      - packages/backend/**
      - packages/shared/**
      - packages/web/package.json
      - packages/web/vite.config.ts
      - package-lock.json
      - scripts/package-smoke.ts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    name: Build the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack -w packages/backend
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: openchesscoach-*.tgz
          retention-days: 14

  package:
    # The same tarball that gets published, run on each system the welcome page covers.
    name: Package check (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Node.js the app accepts, and the LTS the welcome page installs.
          - { os: ubuntu-latest, node: 22.18.0 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # For the check script itself (the protocol client); the app comes from the tarball.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Run it the way the welcome page says
        run: node scripts/package-smoke.ts openchesscoach-*.tgz

  publish:
    name: Publish to npm
    needs: package
    if: >-
      ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/backend/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Run by hand: the release is for package.json's version, and must be a new one.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
              echo "v$version is already released. Bump the version in packages/backend/package.json first." >&2
              exit 1
            fi
          elif [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but packages/backend/package.json says $version. Bump the version, then tag v$version." >&2
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Publish the checked tarball
        run: |
          npm install -g npm@^11.5.1
          npm publish openchesscoach-*.tgz --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # On a run by hand, this creates the tag on the commit that was checked and published.
        run: gh release create "$TAG" openchesscoach-*.tgz --target "$GITHUB_SHA" --generate-notes --title "OpenChessCoach $TAG"
